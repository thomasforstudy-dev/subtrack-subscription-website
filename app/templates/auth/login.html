{% extends "base.html" %}
{% block title %}Log in — SubTrack{% endblock %}
{% block content %}
  <div class="card auth-card">
    <h1>Welcome back 👋</h1>
    <p class="muted">Log in to see what's renewing next.</p>
    {% include "auth/_social.html" %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Email or username <input type="text" name="identifier" required autocomplete="username" value="{{ request.form.get('identifier', '') }}" /></label>
      <label>Password <input type="password" name="password" required autocomplete="current-password" /></label>
      <p class="muted"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </div>
{% endblock %}
